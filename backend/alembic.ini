# Alembic configuration (ETMMS v1.0)
# NOTE: keep this file ASCII-only. Alembic reads it with the system locale
# encoding (GBK on this machine), so non-ASCII characters break parsing.
# The database URL is supplied by migrations/env.py from the application
# settings, which keeps dev and portable builds on the same migration scripts.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
